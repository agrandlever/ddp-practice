<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>対戦結果</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <!-- 結果画面ではJavaScriptを読み込まず、状態確認もしない。 -->
</head>
<body>
<main>
    <h1>対戦結果</h1>
    <!-- 内部エラーやデータ不足の場合は、手・勝敗を推測して表示しない。 -->
    <th:block th:if="${errorCode != 'INTERNAL_ERROR' and myHand != null and opponentHand != null and result != null}">
        <div class="result-hands">
            <th:block th:switch="${myHand}">
                <p th:case="'rock'">あなたの手：グー</p>
                <p th:case="'scissors'">あなたの手：チョキ</p>
                <p th:case="'paper'">あなたの手：パー</p>
            </th:block>
            <th:block th:switch="${opponentHand}">
                <p th:case="'rock'">相手の手：グー</p>
                <p th:case="'scissors'">相手の手：チョキ</p>
                <p th:case="'paper'">相手の手：パー</p>
            </th:block>
        </div>
        <th:block th:switch="${result}">
            <p class="result-message" th:case="'win'">あなたの勝ちです</p>
            <p class="result-message" th:case="'lose'">あなたの負けです</p>
            <p class="result-message" th:case="'draw'">あいこです</p>
        </th:block>
    </th:block>
    <p th:if="${errorCode == 'INTERNAL_ERROR'}"
       th:text="${errorMessage ?: '通信エラーが発生しました。ページを再読み込みしてください。'}"></p>
    <!-- 結果確認の終了は、既存のPOST処理へ送信する。 -->
    <form th:action="@{/result/return}" action="/result/return" method="post">
        <button type="submit">初期画面に戻る</button>
    </form>
</main>
</body>
</html>
