<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>じゃんけんの手を選んでください</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <script th:src="@{/js/play.js}" src="/js/play.js" defer></script>
</head>
<body>
<!-- 表示用の判定だけを行う。手の確定と対戦状態の管理はサーバーに任せる。 -->
<main th:with="confirmed=${errorCode != 'VALIDATION_ERROR' and myHand != null}">
    <h1>じゃんけんの手を選んでください</h1>
    <form th:action="@{/play}" action="/play" method="post">
        <!-- 押したボタンのnameとvalueが送信される。確定後も3つとも残す。 -->
        <div class="hand-buttons">
            <button type="submit" name="hand" value="rock" th:disabled="${confirmed}"
                    th:classappend="${confirmed and myHand == 'rock'} ? 'selected' : ''">グー</button>
            <button type="submit" name="hand" value="scissors" th:disabled="${confirmed}"
                    th:classappend="${confirmed and myHand == 'scissors'} ? 'selected' : ''">チョキ</button>
            <button type="submit" name="hand" value="paper" th:disabled="${confirmed}"
                    th:classappend="${confirmed and myHand == 'paper'} ? 'selected' : ''">パー</button>
        </div>
        <p class="validation-error" th:if="${errorCode == 'VALIDATION_ERROR'}">グー・チョキ・パーのいずれかを選択してください。</p>
    </form>
    <!-- 設計書の3種類だけを日本語表示し、未確定の手や相手の手は表示しない。 -->
    <th:block th:if="${confirmed}" th:switch="${myHand}">
        <p th:case="'rock'">あなたの手：グー</p>
        <p th:case="'scissors'">あなたの手：チョキ</p>
        <p th:case="'paper'">あなたの手：パー</p>
    </th:block>
    <p th:if="${confirmed and waitingForOpponent == true}">対戦相手の選択を待っています</p>
    <!-- 通常のModel属性がなくても表示可能。MSG-003は通常の本文として扱う。 -->
    <p id="communication-error" aria-live="polite" hidden
       th:hidden="${errorCode != 'INTERNAL_ERROR'}"
       th:text="${errorMessage ?: '通信エラーが発生しました。ページを再読み込みしてください。'}"></p>
</main>
</body>
</html>
