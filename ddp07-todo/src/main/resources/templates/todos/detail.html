<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>タスク詳細 | Todoアプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 720px;">
    <h1 class="h2 mb-4">タスク詳細</h1>

    <div th:if="${!loadFailed and successMessage != null}" class="alert alert-success" role="status"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert"
         th:text="${errorMessage}"></div>

    <!-- 取得失敗時はtodoを参照せず、内容と編集・削除の操作をまとめて隠す。 -->
    <div th:unless="${loadFailed}" class="card mb-3">
        <div class="card-body p-4">
            <dl class="mb-4">
                <dt class="mb-2">タイトル</dt>
                <dd class="text-break mb-4" th:text="${todo.title}"></dd>
                <dt class="mb-2">説明</dt>
                <!-- HTMLを組み立てず、CSSで改行を保ったままエスケープ表示する。 -->
                <dd class="text-break mb-4" style="white-space: pre-wrap;"
                    th:text="${#strings.isEmpty(todo.description)} ? '説明なし' : ${todo.description}"></dd>
                <dt class="mb-2">完了状態</dt>
                <dd class="mb-0">
                    <span class="badge" th:classappend="${todo.completed} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${todo.completed} ? '完了' : '未完了'"></span>
                </dd>
            </dl>

            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-primary" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
                <!-- キャンセル時はfalseを返し、フォームのPOST送信を中止する。 -->
                <form method="post" th:action="@{/todos/{id}/delete(id=${todo.id})}"
                      onsubmit="return window.confirm('このタスクを削除しますか？');">
                    <button type="submit" class="btn btn-outline-danger">削除</button>
                </form>
            </div>
        </div>
    </div>

    <a class="btn btn-outline-secondary" th:href="@{/todos}">一覧へ戻る</a>
</main>
</body>
</html>
