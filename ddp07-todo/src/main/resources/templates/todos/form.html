<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Todoアプリ'">タスクフォーム | Todoアプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 720px;">
    <h1 class="h2 mb-4" th:text="${pageTitle}">タスクフォーム</h1>

    <div th:if="${!loadFailed and successMessage != null}" class="alert alert-success" role="status"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert"
         th:text="${errorMessage}"></div>

    <div th:if="${loadFailed}">
        <a class="btn btn-outline-secondary" th:href="@{/todos}">一覧へ戻る</a>
    </div>

    <!-- 親要素で分岐し、初期取得失敗時は存在しないtodoFormを参照しない。 -->
    <div th:unless="${loadFailed}" class="card">
        <div class="card-body p-4">
            <!-- novalidateでブラウザ独自の検証表示を抑え、サーバーの日本語エラーを表示する。 -->
            <form method="post" th:action="@{${formAction}}" th:object="${todoForm}"
                  accept-charset="UTF-8" novalidate>
                <div class="mb-4">
                    <label for="title" class="form-label">タイトル <span class="badge text-bg-danger">必須</span></label>
                    <p id="titleHelp" class="form-text mt-0">前後の空白を除いて100文字以内で入力してください。</p>
                    <!-- th:fieldが初期値・再表示する入力値を設定し、th:errorclassがエラー時の装飾を付ける。 -->
                    <input type="text" id="title" class="form-control" th:field="*{title}"
                           th:errorclass="is-invalid" required aria-describedby="titleHelp titleError"
                           th:attr="aria-invalid=${#fields.hasErrors('title')}">
                    <div id="titleError" class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"></div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label">説明 <span class="badge text-bg-secondary">任意</span></label>
                    <p id="descriptionHelp" class="form-text mt-0">500文字以内で入力してください。</p>
                    <textarea id="description" class="form-control" rows="6" th:field="*{description}"
                              th:errorclass="is-invalid" aria-describedby="descriptionHelp descriptionError"
                              th:attr="aria-invalid=${#fields.hasErrors('description')}"></textarea>
                    <div id="descriptionError" class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}"></div>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary" th:text="${submitLabel}">登録する</button>
                    <a class="btn btn-outline-secondary" th:href="@{${cancelUrl}}">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
