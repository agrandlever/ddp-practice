<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>タスク一覧 | Todoアプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 960px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="h2 mb-0">タスク一覧</h1>
        <a class="btn btn-primary" th:href="@{/todos/new}">タスクを追加</a>
    </div>

    <div th:if="${successMessage != null}" class="alert alert-success" role="status"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert"
         th:text="${errorMessage}"></div>
    <p th:if="${loadFailed}" class="text-body-secondary">ページを再読み込みして、もう一度お試しください。</p>

    <!-- 取得失敗時はtodosを参照せず、0件の案内も表示しない。 -->
    <div th:unless="${loadFailed}">
        <p th:if="${#lists.isEmpty(todos)}" class="alert alert-info">
            タスクはありません。「タスクを追加」から登録してください。
        </p>
        <!-- RepositoryがID降順で返した順序のまま表示する。 -->
        <ul th:unless="${#lists.isEmpty(todos)}" class="list-group">
            <li th:each="todo : ${todos}" class="list-group-item p-3">
                <div class="row align-items-center g-3">
                    <div class="col-12 col-md">
                        <!-- th:textは入力されたHTMLを文字として表示する。 -->
                        <a class="text-break" th:href="@{/todos/{id}(id=${todo.id})}"
                           th:classappend="${todo.completed} ? 'text-decoration-line-through' : ''"
                           th:text="${todo.title}"></a>
                    </div>
                    <div class="col-auto">
                        <span class="badge" th:classappend="${todo.completed} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${todo.completed} ? '完了' : '未完了'"></span>
                    </div>
                    <div class="col-auto">
                        <form method="post" th:action="@{/todos/{id}/toggle(id=${todo.id})}">
                            <button type="submit" class="btn btn-outline-primary btn-sm"
                                    th:text="${todo.completed} ? '未完了に戻す' : '完了にする'"></button>
                        </form>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
