<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isNew} ? '商品登録' : '商品編集'">商品登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="mb-4" th:text="${isNew} ? '商品登録' : '商品編集'">商品登録</h1>

    <!-- 新規・編集で送信先を切り替え、入力値とエラーは同じフォームに結び付ける。 -->
    <form th:action="${isNew} ? @{/products} : @{/products/{id}(id=${productId})}"
          th:object="${productForm}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">商品名</label>
            <input type="text" id="name" th:field="*{name}" class="form-control"
                   th:errorclass="is-invalid" aria-describedby="name-error">
            <!-- メッセージを重複定義せず、BindingResultの検証結果をそのまま表示する。 -->
            <div id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                 class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">価格</label>
            <div class="input-group has-validation">
                <input type="number" id="price" th:field="*{price}" class="form-control"
                       th:errorclass="is-invalid" aria-describedby="price-unit price-error">
                <span id="price-unit" class="input-group-text">円</span>
                <div id="price-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"
                     class="invalid-feedback"></div>
            </div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">説明</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">カテゴリ</label>
            <select id="category" th:field="*{category}" class="form-select"
                    th:errorclass="is-invalid" aria-describedby="category-error">
                <option value="">選択してください</option>
                <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
            </select>
            <div id="category-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"
                 class="invalid-feedback"></div>
        </div>

        <fieldset class="mb-4" aria-describedby="onSale-error">
            <legend class="fs-6">販売状態</legend>
            <!-- checkedを固定せず、Controllerの初期値・編集値・再入力値を反映する。 -->
            <div class="form-check">
                <input type="radio" id="onSale-true" th:field="*{onSale}" value="true"
                       class="form-check-input" th:errorclass="is-invalid">
                <label for="onSale-true" class="form-check-label">販売中</label>
            </div>
            <div class="form-check">
                <input type="radio" id="onSale-false" th:field="*{onSale}" value="false"
                       class="form-check-input" th:errorclass="is-invalid">
                <label for="onSale-false" class="form-check-label">販売停止</label>
            </div>
            <div id="onSale-error" th:if="${#fields.hasErrors('onSale')}" th:errors="*{onSale}"
                 class="invalid-feedback d-block"></div>
        </fieldset>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="${isNew} ? '登録' : '更新'">登録</button>
            <a th:href="${isNew} ? @{/products} : @{/products/{id}(id=${productId})}"
               class="btn btn-secondary">キャンセル</a>
        </div>
    </form>
</main>
</body>
</html>
