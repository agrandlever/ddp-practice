<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="mb-4">商品管理</h1>

    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <form th:action="@{/products}" method="get" class="d-flex flex-wrap align-items-end gap-2">
            <div>
                <label for="category" class="form-label">カテゴリ</label>
                <select id="category" name="category" class="form-select">
                    <option value="" th:selected="${selectedCategory == ''}">すべて</option>
                    <option th:each="category : ${categories}" th:value="${category}"
                            th:text="${category}" th:selected="${category == selectedCategory}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">絞り込む</button>
        </form>
        <a th:href="@{/products/new}" class="btn btn-success">商品を追加</a>
    </div>

    <div th:if="${errorMessage != null}" th:text="${errorMessage}" class="alert alert-danger" role="alert"></div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th scope="col">商品名</th>
                <th scope="col" class="text-end">価格</th>
                <th scope="col">カテゴリ</th>
                <th scope="col">販売状態</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td><a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}"></a></td>
                <td class="text-end text-nowrap" th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')} + '円'"></td>
                <td th:text="${product.category}"></td>
                <td th:text="${product.onSale} ? '販売中' : '販売停止'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="4" class="text-center py-4">商品はありません</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
