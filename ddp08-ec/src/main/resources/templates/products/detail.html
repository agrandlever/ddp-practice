<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 class="mb-4">商品詳細</h1>

    <dl class="row mb-4">
        <dt class="col-sm-3 mb-2">商品名</dt>
        <dd class="col-sm-9 text-break" th:text="${product.name}"></dd>

        <dt class="col-sm-3 mb-2">価格</dt>
        <dd class="col-sm-9" th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')} + '円'"></dd>

        <dt class="col-sm-3 mb-2">説明</dt>
        <dd class="col-sm-9 text-break" th:text="${product.description}"></dd>

        <dt class="col-sm-3 mb-2">カテゴリ</dt>
        <dd class="col-sm-9" th:text="${product.category}"></dd>

        <dt class="col-sm-3 mb-2">販売状態</dt>
        <dd class="col-sm-9" th:text="${product.onSale} ? '販売中' : '販売停止'"></dd>

        <!-- DBの列名ではなく、ProductのJavaプロパティ名で参照する。 -->
        <dt class="col-sm-3 mb-2">登録日時</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(product.createdAt, 'yyyy/MM/dd HH:mm')}"></dd>

        <dt class="col-sm-3 mb-2">更新日時</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(product.updatedAt, 'yyyy/MM/dd HH:mm')}"></dd>
    </dl>

    <div class="d-flex flex-wrap gap-2">
        <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-primary">編集</a>
        <!-- キャンセル時はfalseを返し、フォームのPOST送信を中止する。 -->
        <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post"
              onsubmit="return window.confirm('この商品を削除しますか？');">
            <button type="submit" class="btn btn-danger">削除</button>
        </form>
        <a th:href="@{/products}" class="btn btn-secondary">一覧に戻る</a>
    </div>
</main>
</body>
</html>
